name: GlowScan Android GitHub Release

on:
  workflow_run:
    workflows: ["Flutter CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: glownscan-android-releases
  cancel-in-progress: false

jobs:
  publish:
    name: Build signed APK/AAB and publish release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create local environment file
        run: cp .env.example .env.local

      - name: Configure Firebase Android
        env:
          FIREBASE_ANDROID_JSON_BASE64: ${{ secrets.FIREBASE_ANDROID_JSON_BASE64 }}
        run: |
          if [ -z "$FIREBASE_ANDROID_JSON_BASE64" ]; then
            echo "::error::FIREBASE_ANDROID_JSON_BASE64 secret is required."
            exit 1
          fi
          printf '%s' "$FIREBASE_ANDROID_JSON_BASE64" | base64 --decode > android/app/google-services.json
          application_id=$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          if [ -z "$application_id" ]; then
            echo "::error::Could not detect applicationId."
            exit 1
          fi
          jq -e --arg app_id "$application_id" \
            '.project_info.project_id and any(.client[]; .client_info.android_client_info.package_name == $app_id)' \
            android/app/google-services.json > /dev/null

      - name: Configure Android signing
        env:
          ANDROID_STAGING_KEYSTORE_BASE64: ${{ secrets.ANDROID_STAGING_KEYSTORE_BASE64 }}
          ANDROID_STAGING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STAGING_KEYSTORE_PASSWORD }}
          ANDROID_STAGING_KEY_ALIAS: ${{ secrets.ANDROID_STAGING_KEY_ALIAS }}
          ANDROID_STAGING_KEY_PASSWORD: ${{ secrets.ANDROID_STAGING_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_STAGING_KEYSTORE_BASE64" ] ||
             [ -z "$ANDROID_STAGING_KEYSTORE_PASSWORD" ] ||
             [ -z "$ANDROID_STAGING_KEY_ALIAS" ] ||
             [ -z "$ANDROID_STAGING_KEY_PASSWORD" ]; then
            echo "::error::All ANDROID_STAGING_* signing secrets are required."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/glownscan-staging.jks"
          printf '%s' "$ANDROID_STAGING_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          {
            echo "ANDROID_STAGING_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_STAGING_KEYSTORE_PASSWORD=$ANDROID_STAGING_KEYSTORE_PASSWORD"
            echo "ANDROID_STAGING_KEY_ALIAS=$ANDROID_STAGING_KEY_ALIAS"
            echo "ANDROID_STAGING_KEY_PASSWORD=$ANDROID_STAGING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Determine release version
        env:
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          app_version=$(sed -n 's/^version: \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' pubspec.yaml | head -n 1)
          if [ -z "$app_version" ]; then
            echo "::error::Expected semantic version in pubspec.yaml."
            exit 1
          fi
          {
            echo "APP_VERSION=$app_version"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "RELEASE_TAG=android-v${app_version}-b${BUILD_NUMBER}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-name "$APP_VERSION" --build-number "$BUILD_NUMBER"

      - name: Build release AAB
        run: flutter build appbundle --release --build-name "$APP_VERSION" --build-number "$BUILD_NUMBER"

      - name: Verify APK signing certificate
        env:
          ANDROID_STAGING_CERT_SHA256: ${{ secrets.ANDROID_STAGING_CERT_SHA256 }}
        run: |
          if [ -z "$ANDROID_STAGING_CERT_SHA256" ]; then
            echo "::error::ANDROID_STAGING_CERT_SHA256 secret is required."
            exit 1
          fi
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$apksigner_path" ]; then
            echo "::error::Could not find apksigner."
            exit 1
          fi
          apk_path=build/app/outputs/flutter-apk/app-release.apk
          "$apksigner_path" verify --print-certs "$apk_path"
          actual=$("$apksigner_path" verify --print-certs "$apk_path" | awk -F': ' '/certificate SHA-256 digest:/ {print $2; exit}')
          expected=$(printf '%s' "$ANDROID_STAGING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          actual=$(printf '%s' "$actual" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::APK signing certificate does not match expected SHA-256."
            exit 1
          fi

      - name: Prepare release assets
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/GlowScan-${APP_VERSION}-${BUILD_NUMBER}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/GlowScan-${APP_VERSION}-${BUILD_NUMBER}.aab"
          (cd dist && sha256sum ./*.apk ./*.aab > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists; not overwriting it."
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --target "$SOURCE_SHA" \
            --title "GlowScan v${APP_VERSION} (Build ${BUILD_NUMBER})" \
            --notes "Android APK and AAB built from commit ${SOURCE_SHA}. APK is installable; AAB is intended for app stores." \
            --latest=false

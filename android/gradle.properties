# Optimized for Jenkins EC2: 2 vCPU / 4 GiB RAM
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8

# Limit CPU and memory consumption
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false

# Reuse Gradle build outputs
org.gradle.caching=true

# Reduce Kotlin compiler process overhead
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=true
kotlin.incremental=false
